# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/artifacts/types/csstype"
      - "/artifacts/types/react"
      - "/artifacts/types/react-dom"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/Ivy.Tendril.Wireframe.Console"
      - "/src/Ivy.Tendril.Wireframe.Studio"
      - "/tests/Ivy.Tendril.Wireframe.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
